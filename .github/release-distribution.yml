supported_velocity_versions: &supported_velocity_versions
  - "3.5"

release:
  classification:
    rules:
      - phase: release
        patterns:
          - '^v?\d+\.\d+\.\d+$'
      - phase: beta
        patterns:
          - '^v?\d+\.\d+\.\d+-rc\d+$'
      - phase: alpha
        patterns:
          - '^dev-[0-9a-f]+$'
    default_phase: release

artifacts:
  identica-velocity:
    file: Identica-VELOCITY-{version}.jar
    platforms:
      velocity:
        loaders:
          - velocity
        game_versions: *supported_game_versions
        platform_versions: *supported_velocity_versions

  identica-bungeecord:
    file: Identica-BUNGEECORD-{version}.jar
    platforms:
      bungeecord:
        loaders:
          - bungeecord
          - waterfall
        game_versions: *supported_game_versions

  # A provider jar runs on every proxy Identica supports.
  credential-provider:
    file: Identica-Credential-{version}.jar
    platforms:
      proxy:
        loaders: &proxy_loaders
          - bungeecord
          - velocity
          - waterfall
        game_versions: *supported_game_versions

  premium-provider:
    file: Identica-Premium-{version}.jar
    platforms:
      proxy:
        loaders: *proxy_loaders
        game_versions: *supported_game_versions

publications:
  # Identica gets one Modrinth version per proxy, each with its own jar.
  identica-velocity-modrinth:
    provider:
      id: modrinth
      project_id: DDxUcAy9
      release_type_map: &modrinth_release_types
        release: release
        beta: beta
        alpha: alpha
    artifact: identica-velocity

  identica-bungeecord-modrinth:
    provider:
      id: modrinth
      project_id: DDxUcAy9
      release_type_map: *modrinth_release_types
    artifact: identica-bungeecord

  # A provider jar has no proxy plugin descriptor, so Modrinth only accepts it as a java-agent upload;
  # the version is moved to the proxy loaders right after. Modrinth requires java-agent versions to name
  # their environment; the proxy loaders have none.
  credential-provider-modrinth:
    provider:
      id: modrinth
      project_id: 7mTkb4OS
      release_type_map: *modrinth_release_types
      upload_loaders:
        - java-agent
      loader_fields:
        environment: server_only
      reclassify:
        loaders: *proxy_loaders
      dependencies:
        - project_id: DDxUcAy9
          dependency_type: required
    artifact: credential-provider

  premium-provider-modrinth:
    provider:
      id: modrinth
      project_id: OOO3uDTT
      release_type_map: *modrinth_release_types
      upload_loaders:
        - java-agent
      loader_fields:
        environment: server_only
      reclassify:
        loaders: *proxy_loaders
      dependencies:
        - project_id: DDxUcAy9
          dependency_type: required
    artifact: premium-provider

