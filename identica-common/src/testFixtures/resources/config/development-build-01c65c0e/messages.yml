    - "<white>Please contact a server administrator.</white>"
    - ""
    - "<dark_gray>discord.arcadeya.com"
  noProvidersMatched:
    - "<green>ɪᴅᴇɴᴛɪᴄᴀ"
    - ""
    - "<white>No providers matched, if this issue persists"
    - "<white>Please contact a server administrator.</white>"
    - ""
