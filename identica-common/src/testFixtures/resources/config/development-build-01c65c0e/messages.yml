        - "<white>Please contact a server administrator.</white>"
        - ""
        - "<dark_gray>discord.arcadeya.com"
      enrollment:
        body:
          - " "
          - " <green><bold>Identica</bold>"
          - "  <white>Select an authentication method for account</white>"
          - "  <white>It can be changed later on.</white>"
          - " "
          - "  <gray>Available providers:</gray>"
          - "{entries}"
          - " "
        entryFormat:
          format: "   <dark_gray><click:run_command:/identica enroll {providerId}>▪ <gray>[{providerName}]:</gray> <white>{description}</click>"
          emptyFormat: "   <dark_gray><click:run_command:/identica enroll {providerId}>▪ <gray>[{providerName}]:</gray></click>"
