_version: 1
commands:
  admin-force-register:
    enabled: true
    aliases:
      - "credential register"
    permission: "identica.admin"
    description: "Force register a credential account"
    usage: "{command} {alias} <username> <password>"
    cooldown:
      enabled: true
      duration: 2
      group: "global"
    arguments:
      password: "Credential"
      username: "Username"
    hide: false
  credential:
    enabled: true
    aliases:
      - "credential"
    permission: ""
    description: "Credential account migration"
    usage: "{alias}"
    cooldown:
      enabled: true
      duration: 2
      group: "global"
    arguments: {}
    hide: false
  admin-set-password:
    enabled: true
    aliases:
      - "credential setpassword"
    permission: "identica.admin"
    description: "Set a credential account password"
    usage: "{command} {alias} <username> <password>"
    cooldown:
      enabled: true
      duration: 2
      group: "global"
    arguments:
      password: "Credential"
      username: "Username"
    hide: false
  pass:
    enabled: true
    aliases:
      - "pass"
    permission: ""
    description: "Register a credential account"
    usage: "{alias} <password>"
    cooldown:
      enabled: true
      duration: 2
      group: "global"
    arguments:
      password: "Credential"
    hide: true
  change-password:
    enabled: true
    aliases:
      - "changepassword"
      - "changepass"
    permission: ""
    description: "Change password account password"
    usage: "{alias} <current> <new> [repeat]"
    cooldown:
      enabled: true
      duration: 2
      group: "global"
    arguments:
      new: "New"
      repeat: "Repeat"
      current: "Current"
    hide: false
  passconfirm:
    enabled: true
    aliases:
      - "passconfirm"
    permission: ""
    description: "Confirm credential registration"
    usage: "{alias} <password>"
    cooldown:
      enabled: true
      duration: 2
      group: "global"
    arguments:
      password: "Repeat"
    hide: true
  credential-confirm:
    enabled: true
    aliases:
      - "credential confirm"
    permission: ""
    description: "Confirm credential migration"
    usage: "{alias} [input]"
    arguments:
      input: "Code"
    hide: true
  login:
    enabled: true
    aliases:
      - "login"
      - "l"
    permission: ""
    description: "Login to a credential account"
    usage: "{alias} <password>"
    cooldown:
      enabled: true
      duration: 2
      group: "global"
    arguments:
      password: "Credential"
    hide: true
  credential-cancel:
    enabled: true
    aliases:
      - "credential cancel"
    permission: ""
    description: "Cancel credential migration"
    usage: "{alias}"
    arguments: {}
    hide: true
