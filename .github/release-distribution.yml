supported_velocity_versions: &supported_velocity_versions
  - "3.5"

release:
  classification:
    rules:
      - phase: release
        patterns:
          - '^v?\d+\.\d+\.\d+$'
      - phase: beta
        patterns:
          - '^v?\d+\.\d+\.\d+-rc\d+$'
      - phase: alpha
        patterns:
          - '^dev-[0-9a-f]+$'
    default_phase: release

artifacts:
  identica:
    file: Identica-VELOCITY-{version}.jar
    platforms:
      velocity:
        loaders:
          - velocity
        game_versions: *supported_game_versions
        platform_versions: *supported_velocity_versions

  password-provider:
    file: Identica-Password-{version}.jar
    platforms:
      velocity:
        loaders:
          - velocity
        game_versions: *supported_game_versions
        platform_versions: *supported_velocity_versions

  premium-provider:
    file: Identica-Premium-{version}.jar
    platforms:
      velocity:
        loaders:
          - velocity
        game_versions: *supported_game_versions
        platform_versions: *supported_velocity_versions

publications:
  identica-modrinth:
    provider:
      id: modrinth
      project_id: D26hHMI2
      release_type_map:
        release: release
        beta: beta
        alpha: alpha
    artifact: identica
    platforms:
      - velocity

  password-provider-modrinth:
    provider:
      id: modrinth
      project_id: cFnEyCND
      release_type_map:
        release: release
        beta: beta
        alpha: alpha
      upload_loaders:
        - java-agent
      reclassify:
        loaders:
          - velocity
      dependencies:
        - project_id: D26hHMI2
          dependency_type: required
    artifact: password-provider
    platforms:
      - velocity

  premium-provider-modrinth:
    provider:
      id: modrinth
      project_id: OOO3uDTT
      release_type_map:
        release: release
        beta: beta
        alpha: alpha
      upload_loaders:
