name: Suggestion
description: Suggest a new feature or a change to existing behavior.
labels:
  - suggestion
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you are trying to do and what stops you today.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How Identica could solve it, for players and for admins.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Workarounds or other solutions you considered.

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Authentication
        - Commands
        - Configuration
        - Credential
        - Database
        - Messages
        - Migration
        - Platform
        - Premium
        - Recognition
        - Replication
        - Restriction
        - Routing
        - Sessions
        - API
        - Other
