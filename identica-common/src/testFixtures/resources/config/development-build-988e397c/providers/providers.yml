_version: 1
conflicts:
  username:
    pairs:
      - providers:
          - "premium"
          - "credential"
        force: false
        resolvers:
          - id: "format_display"
            parameters:
              format:
                pattern: "{username}_{incomingProvider}"
              target: "joiner"
    default:
      providers: []
      force: false
      resolvers:
        - id: "format_display"
          parameters:
            format:
              pattern: "{username}*"
            target: "joiner"
providers:
  - id: "credential"
    displayName: "CR"
    enabled: true
    priority: 50
    overrides:
      recognition:
        signals: []
        eligibility:
          allowOnUntrustedIp: false
    verification:
      enabled: true
      required: false
      unavailableSelectionPolicy: "KEEP_LOCKED"
      methods:
        - id: "totp"
          enabled: true
          priority: 100
          unavailableSelectionPolicy: "KEEP_LOCKED"
    entrypoints:
      - "credential.arcadeya.com"
  - id: "premium"
    displayName: "PR"
    enabled: true
    priority: 100
    overrides:
      recognition:
        signals: []
        eligibility:
          allowOnUntrustedIp: false
    verification:
      enabled: true
      required: false
      unavailableSelectionPolicy: "KEEP_LOCKED"
      methods:
        - id: "totp"
          enabled: true
          priority: 100
          unavailableSelectionPolicy: "KEEP_LOCKED"
    entrypoints:
      - "premium.arcadeya.com"
