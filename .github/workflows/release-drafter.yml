name: Release drafter

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: release-drafter-${{ github.ref }}
  cancel-in-progress: true

jobs:
  draft:
    name: Update draft
    runs-on: ubuntu-latest
    steps:
      - id: drafter
        uses: release-drafter/release-drafter@v7
        with:
          commitish: dev
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Group changes by title prefix
        uses: whereareiam/blockops/primitive/release/draft/regroup@feature/v4-structure
        with:
          release-id: ${{ steps.drafter.outputs.id }}
          release-body: ${{ steps.drafter.outputs.body }}
