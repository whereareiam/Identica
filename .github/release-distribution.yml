          dependency_type: required
    artifact: premium-provider
    platforms:
      - velocity

  identica-hangar:
    provider:
      id: hangar
      project_slug: "whereareiam/Identica"
      release_type_map:
        release: Release
        beta: Beta
        alpha: Beta
    artifact: identica
    platforms:
      - velocity

  password-provider-hangar:
    provider:
      id: hangar
      project_slug: "whereareiam/Identica-Offline-Provider"
      release_type_map:
        release: Release
        beta: Beta
        alpha: Beta
      dependencies:
        - kind: hangar
          name: Identica
          required: true
    artifact: password-provider
    platforms:
      - velocity

  premium-provider-hangar:
