_version: 1
scenario:
  registration:
    enabled: true
    requireRepeat: true
    username:
      minLength: 3
      maxLength: 16
      pattern: "^[a-zA-Z0-9_]+$"
    password:
      minLength: 6
      maxLength: 32
      minUpper: 1
      minLower: 1
      minNumber: 1
      minSpecial: 1
  authentication:
    bruteforce:
      maxAttempts: 5
      lockout:
        enabled: true
        duration: "5m"
      warning:
        enabled: true
        thresholdPercentage: 50
  changePassword:
    requireRepeat: true
replication:
  cache:
    lockout: "password-lockout"
cryptography:
  algorithm: "bcrypt"
  autoupgrade: true
  algorithms:
    bcrypt:
      cost: 12
    argon2:
      iterations: 3
      parallelism: 1
      memoryKb: 65536
