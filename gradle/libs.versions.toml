toolkit = "dev-8c0271b"
freefair = "9.5.0"

# compile time processing
lombok = "1.18.42"

# general
attache = "dev-58f53b4"
configura = "1.0.0"
commandant = "dev-642fe14"
keystone = "dev-790a33e"
dialectica = "1.0.0"
strata = "1.0.0"

guice = "7.0.0"
annotations = "26.0.1"
jedis = "7.0.0"
bStats = "3.2.1"

# adventure
adventure = "4.25.0"
adventure-platform = "4.3.4"

# cloud
cloud-core = "2.0.0"
cloud-cooldown = "1.0.0-rc.1"
cloud-bungee = "dev-2ac9f72"
cloud-velocity = "dev-2ac9f72"
cloud-minecraft-extras = "dev-2ac9f72"

# platform api
bungeecord = "26.1-R0.1-SNAPSHOT"
velocity = "3.5.0-SNAPSHOT"

# database
jdbi = "3.51.0"
hikaricp = "7.0.2"
postgresql = "42.7.8"
mariadb = "3.5.6"
sqlite = "3.45.3.0"
h2 = "2.4.240"

# testing
junit = "6.0.1"
mockito = "5.20.0"
testcontainers = "2.0.2"
testcontainers-redis = "2.2.4"

# providers
# credential provider
argon2 = "2.12"
bcrypt = "0.10.2"

[libraries]

# compile time processing
lombok = { group = "org.projectlombok", name = "lombok", version.ref = "lombok" }
lombok-plugin = { group = "io.freefair.gradle", name = "lombok-plugin", version.ref = "freefair" }
shadow = { group = "com.gradleup.shadow", name = "shadow-gradle-plugin", version.ref = "shadow" }
toolkit-publish-maven = { group = "me.whereareiam.toolkit", name = "publish-maven", version.ref = "toolkit" }

# general
attache-common = { group = "me.whereareiam", name = "attache-common", version.ref = "attache" }
attache-bungeecord = { group = "me.whereareiam", name = "attache-bungeecord", version.ref = "attache" }
attache-velocity = { group = "me.whereareiam", name = "attache-velocity", version.ref = "attache" }
attache-standalone = { group = "me.whereareiam", name = "attache-standalone", version.ref = "attache" }
configura = { group = "me.whereareiam", name = "configura", version.ref = "configura" }
configura-feature-extension = { group = "me.whereareiam.configura.feature", name = "extension", version.ref = "configura" }
configura-feature-polymorphic = { group = "me.whereareiam.configura.feature", name = "polymorphic", version.ref = "configura" }
configura-feature-postprocess = { group = "me.whereareiam.configura.feature", name = "postprocess", version.ref = "configura" }
commandant = { group = "me.whereareiam", name = "commandant", version.ref = "commandant" }
keystone = { group = "me.whereareiam", name = "keystone", version.ref = "keystone" }
strata-common = { group = "me.whereareiam", name = "strata-common", version.ref = "strata" }
dialectica = { group = "me.whereareiam", name = "dialectica", version.ref = "dialectica" }
jedis = { group = "redis.clients", name = "jedis", version.ref = "jedis" }
bStats = { group = "org.bstats", name = "bstats-base", version.ref = "bStats" }
bStats-bungeecord = { group = "org.bstats", name = "bstats-bungeecord", version.ref = "bStats" }
bStats-velocity = { group = "org.bstats", name = "bstats-velocity", version.ref = "bStats" }

guice = { group = "com.google.inject", name = "guice", version.ref = "guice" }
annotations = { group = "org.jetbrains", name = "annotations", version.ref = "annotations" }

# adventure
adventure = { group = "net.kyori", name = "adventure-api", version.ref = "adventure" }
adventure-platform-bungeecord = { group = "net.kyori", name = "adventure-platform-bungeecord", version.ref = "adventure-platform" }
adventure-minimessage = { group = "net.kyori", name = "adventure-text-minimessage", version.ref = "adventure" }
adventure-plain = { group = "net.kyori", name = "adventure-text-serializer-plain", version.ref = "adventure" }

# cloud
cloud-core = { group = "org.incendo", name = "cloud-core", version.ref = "cloud-core" }
cloud-annotations = { group = "org.incendo", name = "cloud-annotations", version.ref = "cloud-core" }
cloud-cooldowns = { group = "org.incendo", name = "cloud-processors-cooldown", version.ref = "cloud-cooldown" }
cloud-bungee = { group = "me.whereareiam", name = "cloud-bungee", version.ref = "cloud-bungee" }
cloud-velocity = { group = "me.whereareiam", name = "cloud-velocity", version.ref = "cloud-velocity" }
cloud-minecraft-extras = { group = "me.whereareiam", name = "cloud-minecraft-extras", version.ref = "cloud-minecraft-extras" }

# platform api
bungeecord = { group = "net.md-5", name = "bungeecord-api", version.ref = "bungeecord" }
velocity = { group = "com.velocitypowered", name = "velocity-api", version.ref = "velocity" }

# database
jdbi-core = { group = "org.jdbi", name = "jdbi3-core", version.ref = "jdbi" }
jdbi-sqlobject = { group = "org.jdbi", name = "jdbi3-sqlobject", version.ref = "jdbi" }
hikaricp = { group = "com.zaxxer", name = "HikariCP", version.ref = "hikaricp" }
postgresql = { group = "org.postgresql", name = "postgresql", version.ref = "postgresql" }
mariadb = { group = "org.mariadb.jdbc", name = "mariadb-java-client", version.ref = "mariadb" }
sqlite = { group = "org.xerial", name = "sqlite-jdbc", version.ref = "sqlite" }
h2 = { group = "com.h2database", name = "h2", version.ref = "h2" }

# testing
junit-jupiter = { group = "org.junit.jupiter", name = "junit-jupiter", version.ref = "junit" }
junit-platform = { group = "org.junit.platform", name = "junit-platform-launcher", version.ref = "junit" }
mockito-core = { group = "org.mockito", name = "mockito-core", version.ref = "mockito" }
mockito-junit = { group = "org.mockito", name = "mockito-junit-jupiter", version.ref = "mockito" }
testcontainers-junit = { group = "org.testcontainers", name = "testcontainers-junit-jupiter", version.ref = "testcontainers" }
testcontainers-mariadb = { group = "org.testcontainers", name = "testcontainers-mariadb", version.ref = "testcontainers" }
testcontainers-postgresql = { group = "org.testcontainers", name = "testcontainers-postgresql", version.ref = "testcontainers" }
testcontainers-redis = { group = "com.redis", name = "testcontainers-redis", version.ref = "testcontainers-redis" }

# providers
# credential provider
argon2 = { group = "de.mkammerer", name = "argon2-jvm", version.ref = "argon2" }
bcrypt = { group = "at.favre.lib", name = "bcrypt", version.ref = "bcrypt" }

[bundles]

adventure = ["adventure", "adventure-minimessage", "adventure-plain"]
cloud = ["cloud-core", "cloud-annotations", "cloud-cooldowns", "cloud-minecraft-extras"]
database = ["jdbi-core", "jdbi-sqlobject", "hikaricp", "postgresql", "mariadb", "sqlite", "h2"]
bStats-velocity = ["bStats", "bStats-velocity"]
bStats-bungeecord = ["bStats", "bStats-bungeecord"]

[plugins]

shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
buildconfig = { id = "com.github.gmazzo.buildconfig", version.ref = "buildconfig" }
spawner = { id = "me.whereareiam.spawner", version.ref = "spawner" }
attache = { id = "me.whereareiam.attache", version.ref = "attache" }
toolkit-versioning = { id = "me.whereareiam.toolkit.versioning", version.ref = "toolkit" }
freefair-lombok = { id = "io.freefair.lombok", version.ref = "freefair" }
