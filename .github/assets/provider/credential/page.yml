# The Credential provider's description page, rendered by Pictura: pictura render <this folder>
name: Identica Credential Provider
accent: "#FF961F"
images: https://github.com/whereareiam/Identica/blob/dev/.github/assets/provider/credential/render/{file}?raw=true

views:
  - header:
      logo: {text: IDENTICA, small: CREDENTIAL PROVIDER, creeper: 7, color: "#FF7A00", small_border: 0, width: 620}
      pitch: >-
        Password <accent>registration and login</> for your players, as a provider for Identica.
      badge: badge-light
      badge_font: minecraft-ten
      badge_width: 104
      badge_gap: 39
      platforms: [Velocity, BungeeCord]
      versions: "Supported versions: 1.7+"
      versions_badge: button-green-rim
      versions_gap: 25

  - board:
      title: Dependencies & Information
      cards:
        - {title: Identica, text: "A provider for Identica. Put it into Identica's providers folder, from the same release as Identica."}
        - {title: Passwords, text: "Stored as bcrypt hashes by default, or Argon2id. Older hashes are upgraded when the player logs in."}
        - {title: Good to know, tone: warning, text: "Credential names are not case-sensitive, and a provider that owns its usernames can claim a name a Credential account holds; that account is then renamed."}

  - feature:
      title: Passwords done right
      icon: key
      text: Players register with a password and log in with it, with rules and protection you <accent>configure</>.
      points:
        - {label: Registration, text: "players repeat their password, which must follow your length and character rules."}
        - {label: Lockout, text: "5 wrong passwords lock the account for 5 minutes by default, with warnings before."}
        - {label: Change it, text: "players change their password any time with a command."}

  - grid:
      title: Supports Identica's features
      tiles:
        - {icon: shield, title: Verification, text: "A second step such as TOTP after the login."}
        - {icon: check, title: Recognition, text: "Returning players skip the full login while their signals match."}
        - {icon: warning, title: Sentinel, text: "Watches for repeated or risky actions."}
        - {icon: gear, title: Restriction, text: "Lets admins temporarily block new joins through this provider."}

  - steps:
      title: Getting started
      steps:
        - {title: Install, text: "Install Identica, then put Identica-Credential into its providers folder."}
        - {title: Start, text: "Start the proxy once, then stop it."}
        - {title: Enable, text: "Enable the provider in Identica's configuration and start the proxy."}

  - support:
      style: panel
      player: whereareiam
      link: https://discord.arcadeya.com/
      text: Stuck? The team and the community answer fast.
      button: Join Discord
